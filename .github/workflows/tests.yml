name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[fishbase]"
      - run: python -m unittest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # type checks, then builds
      - run: npm run build

  # the image starts, makes its database and answers its health check
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fishtank .
      - run: docker run -d --name fishtank -p 5000:5000 fishtank
      - run: |
          for attempt in $(seq 30); do
            curl -fs http://127.0.0.1:5000/readyz && exit 0
            sleep 2
          done
          docker logs fishtank
          exit 1
      - run: docker exec fishtank flask --app fishtank backup /app/backups
