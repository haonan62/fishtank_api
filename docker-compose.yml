# One app behind nginx on a small server, see "Deployment" in README.md
services:
  web:
    build: .
    image: fishtank:latest
    restart: unless-stopped
    environment:
      # nginx sits in front of the app, see deploy/nginx.conf
      FISHTANK_PROXIES: "1"
    ports:
      # only nginx on this machine reaches the app, the login cookie needs its https
      - "127.0.0.1:5000:5000"
    volumes:
      - fishtank-data:/app/instance
      - fishtank-backups:/app/backups
    # users and fishtanks live in one sqlite file, so one container. It used about 60 MB serving the catalogue to 8 clients
    mem_limit: 128m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  fishtank-data:
  fishtank-backups:
