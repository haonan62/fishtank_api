# Copy to /etc/nginx/conf.d/fishtank.conf, replace example.org with your domain, and get its certificate with certbot:
#   certbot certonly --webroot -w /var/www/certbot -d example.org
# The app is on 127.0.0.1:5000, see docker-compose.yml

server {
    listen 80;
    server_name example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.org;

    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # spreadsheets of fish are the largest thing anyone sends
    client_max_body_size 5m;

    # the app compresses its own json, the built ui's files are left to nginx
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        # the app trusts these because FISHTANK_PROXIES is 1
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
